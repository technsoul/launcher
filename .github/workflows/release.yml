name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            bin: techsouls-launcher.exe
          - os: macos-latest
            os_name: macos
            target: aarch64-apple-darwin
            bin: techsouls-launcher
          - os: ubuntu-22.04
            os_name: linux
            target: x86_64-unknown-linux-gnu
            bin: techsouls-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/techsouls-launcher-windows.exe

      - name: Package Linux (.deb)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/*.deb dist/techsouls-launcher-linux-amd64.deb

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dmg/TechSouls Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TechSouls Launcher</string>
            <key>CFBundleDisplayName</key><string>TechSouls Launcher</string>
            <key>CFBundleIdentifier</key><string>com.technsoul.launcher</string>
            <key>CFBundleExecutable</key><string>${{ matrix.bin }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dmg/Applications
          mkdir -p dist
          hdiutil create -volname "TechSouls Launcher" -srcfolder dmg -ov -format UDZO dist/techsouls-launcher-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: techsouls-launcher-${{ matrix.os_name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
