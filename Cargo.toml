[package]
name = "techsouls-launcher"
version = "0.1.1"
edition = "2024"
description = "TechSouls Launcher - install, update and launch TechSouls apps"
authors = ["TechSouls <krash.abedo@gmail.com>"]
license = "Proprietary"
repository = "https://github.com/technsoul/launcher"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg", "file"] }
flate2 = "1.1.10"
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[package.metadata.deb]
name = "techsouls-launcher"
maintainer = "TechSouls <krash.abedo@gmail.com>"
section = "games"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libgl1, libwayland-client0, libx11-6"
assets = [
    ["target/release/techsouls-launcher", "usr/bin/", "755"],
    ["assets/linux/techsouls-launcher.desktop", "usr/share/applications/", "644"],
]
